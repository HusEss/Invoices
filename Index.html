<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Aus Invoice Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 16px 12px 80px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .subhead {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 0;
            background: #e2e8f0;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            background: #1e293b;
            color: white;
        }
        .tab-btn:active {
            transform: scale(0.96);
        }
        /* ===== PANELS ===== */
        .panel {
            display: none;
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }
        .panel.active {
            display: block;
        }
        /* ===== FORMS & INPUTS ===== */
        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
            transition: 0.15s;
            font-family: inherit;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #1e293b;
            background: white;
        }
        textarea {
            min-height: 60px;
            resize: vertical;
        }
        .btn {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 12px;
            width: 100%;
            text-align: center;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
            display: inline-block;
            margin-right: 6px;
        }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .row>* {
            flex: 1;
            min-width: 100px;
        }
        .row .btn {
            flex: 0 1 auto;
            width: auto;
        }
        hr {
            margin: 16px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        .chip {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            display: inline-block;
            margin: 4px 4px 4px 0;
        }
        .item-list {
            margin-top: 10px;
        }
        .item-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .item-card .info {
            font-size: 14px;
        }
        .item-card .info strong {
            display: block;
            font-size: 16px;
        }
        .badge {
            background: #1e293b;
            color: white;
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
            font-size: 15px;
        }
        /* ===== INVOICE PREVIEW ===== */
        #invoicePreview {
            background: white;
            padding: 20px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin: 16px 0;
            font-size: 13px;
            line-height: 1.6;
        }
        #invoicePreview .inv-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        #invoicePreview .inv-title {
            font-size: 24px;
            font-weight: 700;
        }
        #invoicePreview .inv-business {
            text-align: right;
        }
        #invoicePreview .inv-business strong {
            font-size: 16px;
        }
        #invoicePreview table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }
        #invoicePreview th {
            background: #f1f5f9;
            text-align: left;
            padding: 8px 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        #invoicePreview td {
            padding: 8px 6px;
            border-bottom: 1px solid #e2e8f0;
        }
        #invoicePreview .totals {
            text-align: right;
            margin-top: 8px;
            border-top: 2px solid #1e293b;
            padding-top: 10px;
        }
        #invoicePreview .totals div {
            padding: 2px 0;
        }
        #invoicePreview .totals .grand {
            font-size: 18px;
            font-weight: 700;
        }
        /* ===== TOGGLE SWITCH ===== */
        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }
        .toggle-wrap input[type="checkbox"] {
            width: 48px;
            height: 28px;
            appearance: none;
            background: #cbd5e1;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            border: none;
        }
        .toggle-wrap input[type="checkbox"]::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle-wrap input[type="checkbox"]:checked {
            background: #1e293b;
        }
        .toggle-wrap input[type="checkbox"]:checked::after {
            left: 23px;
        }
        .toggle-wrap label {
            margin: 0;
            font-weight: 500;
        }
        /* ===== STATUS MESSAGE ===== */
        #statusMsg {
            padding: 10px 14px;
            border-radius: 10px;
            margin: 10px 0 6px;
            display: none;
            font-weight: 500;
            font-size: 14px;
        }
        #statusMsg.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }
        #statusMsg.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        /* ===== HISTORY ===== */
        .hist-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .hist-item .left {
            font-size: 14px;
        }
        .hist-item .left .num {
            font-weight: 700;
            font-size: 16px;
        }
        .hist-item .right .btn {
            width: auto;
            padding: 6px 14px;
            font-size: 13px;
            margin-top: 0;
        }
        /* ===== UTILITIES ===== */
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .flex .btn {
            flex: 1;
            min-width: 80px;
        }
        /* line items in form */
        .line-item {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .line-item input {
            flex: 1;
            min-width: 60px;
            padding: 8px 10px;
            font-size: 15px;
        }
        .line-item .btn {
            flex: 0 0 auto;
            width: auto;
            padding: 8px 14px;
            margin-top: 0;
            background: #ef4444;
        }
        /* small screens */
        @media (max-width: 480px) {
            .tabs .tab-btn {
                font-size: 12px;
                padding: 8px 0;
                min-width: 50px;
            }
            #invoicePreview {
                font-size: 12px;
                padding: 12px;
            }
            #invoicePreview .inv-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>🧾 Invoice<span style="font-size:16px;font-weight:400;color:#64748b;"> .au</span></h1>
    <div class="subhead">Australian Tax Invoices · offline · free</div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="tab-invoice">New</button>
        <button class="tab-btn" data-tab="tab-clients">Clients</button>
        <button class="tab-btn" data-tab="tab-business">Business</button>
        <button class="tab-btn" data-tab="tab-history">History</button>
    </div>

    <!-- ===== PANEL: NEW INVOICE ===== -->
    <div class="panel active" id="tab-invoice">
        <h2 style="font-size:18px;margin-bottom:4px;">Create Invoice</h2>
        <p style="color:#64748b;font-size:14px;">Select profiles, enter hours &amp; rate</p>

        <!-- Status message -->
        <div id="statusMsg"></div>

        <label for="invBusiness">Your Business (ABN)</label>
        <select id="invBusiness"></select>

        <label for="invClient">Client</label>
        <select id="invClient"></select>

        <label style="margin-top:16px;">Line Items</label>
        <div id="lineItemsContainer">
            <div class="line-item">
                <input type="text" placeholder="Description" class="li-desc" value="Consulting" />
                <input type="number" placeholder="Hours" class="li-hours" value="2" step="0.5" min="0" />
                <input type="number" placeholder="Rate ($)" class="li-rate" value="150" step="0.01" min="0" />
                <button class="btn btn-danger btn-sm remove-line" style="background:#ef4444;">✕</button>
            </div>
        </div>
        <button class="btn btn-secondary btn-sm" id="addLineItem" style="width:auto;margin-top:4px;">+ Add line</button>

        <div class="toggle-wrap">
            <input type="checkbox" id="includeGST" checked />
            <label for="includeGST">Include GST (10%)</label>
        </div>

        <button class="btn btn-success" id="previewBtn">🔄 Preview Invoice</button>

        <div id="invoicePreview" style="display:none;"></div>

        <div class="flex" style="margin-top:8px;">
            <button class="btn" id="generatePdfBtn" style="flex:2;">📄 Download PDF</button>
            <button class="btn btn-secondary" id="saveInvoiceBtn" style="flex:1;">💾 Save</button>
        </div>
        <p id="saveMessage" style="font-size:14px;color:#10b981;margin-top:6px;text-align:center;"></p>
    </div>

    <!-- ===== PANEL: CLIENTS ===== -->
    <div class="panel" id="tab-clients">
        <h2 style="font-size:18px;">Clients</h2>
        <div id="clientList"></div>
        <hr />
        <h3 style="font-size:16px;">Add / Edit Client</h3>
        <input type="hidden" id="editClientId" />
        <label>Client Name *</label>
        <input type="text" id="clientName" placeholder="e.g. Acme Pty Ltd" />
        <label>ABN</label>
        <input type="text" id="clientAbn" placeholder="12 345 678 901" />
        <label>Address</label>
        <textarea id="clientAddress" placeholder="Street, Suburb, State, Postcode"></textarea>
        <label>Email</label>
        <input type="email" id="clientEmail" placeholder="billing@client.com" />
        <div class="flex">
            <button class="btn" id="saveClientBtn">💾 Save Client</button>
            <button class="btn btn-secondary" id="cancelClientBtn" style="display:none;">Cancel</button>
        </div>
    </div>

    <!-- ===== PANEL: BUSINESS ===== -->
    <div class="panel" id="tab-business">
        <h2 style="font-size:18px;">My Business Profiles</h2>
        <p style="color:#64748b;font-size:14px;">You can have multiple ABNs / entities.</p>
        <div id="businessList"></div>
        <hr />
        <h3 style="font-size:16px;">Add / Edit Business</h3>
        <input type="hidden" id="editBizId" />
        <label>Business Name *</label>
        <input type="text" id="bizName" placeholder="e.g. My Trading Co" />
        <label>ABN *</label>
        <input type="text" id="bizAbn" placeholder="12 345 678 901" />
        <label>Address</label>
        <textarea id="bizAddress" placeholder="Street, Suburb, State, Postcode"></textarea>
        <label>Phone</label>
        <input type="text" id="bizPhone" placeholder="0400 000 000" />
        <label>Email</label>
        <input type="email" id="bizEmail" placeholder="info@myco.com.au" />
        <label>Bank Details (BSB / Acc)</label>
        <input type="text" id="bizBank" placeholder="BSB: 123-456, Acc: 78901234" />
        <div class="flex">
            <button class="btn" id="saveBizBtn">💾 Save Business</button>
            <button class="btn btn-secondary" id="cancelBizBtn" style="display:none;">Cancel</button>
        </div>
        <hr />
        <div class="flex">
            <button class="btn btn-secondary btn-sm" id="exportDataBtn">📤 Export Data</button>
            <button class="btn btn-secondary btn-sm" id="importDataBtn">📥 Import Data</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;" />
        </div>
    </div>

    <!-- ===== PANEL: HISTORY ===== -->
    <div class="panel" id="tab-history">
        <h2 style="font-size:18px;">Invoice History</h2>
        <div id="historyList"></div>
        <button class="btn btn-danger btn-sm" id="clearHistoryBtn" style="width:auto;margin-top:8px;">🗑️ Clear All</button>
    </div>

    <script>
        // ============================================================
        // DATA LAYER (localStorage)
        // ============================================================
        const STORAGE_KEY = 'ausInvoiceAppData';

        function getDefaultData() {
            return {
                businesses: [],
                clients: [],
                invoices: [],
                nextInvoiceNumber: 1
            };
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (!data.businesses) data.businesses = [];
                    if (!data.clients) data.clients = [];
                    if (!data.invoices) data.invoices = [];
                    if (!data.nextInvoiceNumber) data.nextInvoiceNumber = 1;
                    return data;
                }
            } catch (_) { /* ignore */ }
            return getDefaultData();
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        let appData = loadData();

        // ============================================================
        // SEED DEMO DATA if completely empty
        // ============================================================
        function seedDemoData() {
            if (appData.businesses.length === 0 && appData.clients.length === 0) {
                appData.businesses.push({
                    id: 'biz_demo',
                    name: 'My Business Pty Ltd',
                    abn: '12 345 678 901',
                    address: '123 George St, Sydney NSW 2000',
                    phone: '0400 000 000',
                    email: 'info@mybusiness.com.au',
                    bankDetails: 'BSB: 012-345, Acc: 98765432'
                });
                appData.clients.push({
                    id: 'client_demo',
                    name: 'Demo Client Pty Ltd',
                    abn: '98 765 432 109',
                    address: '456 Collins St, Melbourne VIC 3000',
                    email: 'billing@democlient.com'
                });
                saveData(appData);
            }
        }
        seedDemoData();

        // ============================================================
        // HELPERS
        // ============================================================
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }

        function formatDate(d) {
            const dt = new Date(d);
            return dt.toLocaleDateString('en-AU', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function getBusiness(id) { return appData.businesses.find(b => b.id === id); }

        function getClient(id) { return appData.clients.find(c => c.id === id); }

        function getNextInvoiceNumber() {
            const num = appData.nextInvoiceNumber;
            appData.nextInvoiceNumber += 1;
            saveData(appData);
            return 'INV-' + String(num).padStart(4, '0');
        }

        // Temporary invoice number for preview (does NOT increment counter)
        function getTempInvoiceNumber() {
            return 'PREVIEW-' + Date.now().toString(36).toUpperCase();
        }

        // ============================================================
        // STATUS MESSAGE HELPERS
        // ============================================================
        function showStatus(msg, type = 'error') {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }

        function hideStatus() {
            const el = document.getElementById('statusMsg');
            el.style.display = 'none';
            el.className = '';
        }

        // ============================================================
        // RENDER: Populate dropdowns
        // ============================================================
        function populateDropdowns() {
            const bizSelect = document.getElementById('invBusiness');
            const clientSelect = document.getElementById('invClient');
            const currentBiz = bizSelect.value;
            const currentClient = clientSelect.value;

            bizSelect.innerHTML = '<option value="">— Select Business —</option>';
            appData.businesses.forEach(b => {
                bizSelect.innerHTML += `<option value="${b.id}">${b.name} (${b.abn})</option>`;
            });
            if (currentBiz && appData.businesses.some(b => b.id === currentBiz)) bizSelect.value = currentBiz;
            else if (appData.businesses.length > 0) bizSelect.value = appData.businesses[0].id;

            clientSelect.innerHTML = '<option value="">— Select Client —</option>';
            appData.clients.forEach(c => {
                clientSelect.innerHTML += `<option value="${c.id}">${c.name} (${c.abn || 'no ABN'})</option>`;
            });
            if (currentClient && appData.clients.some(c => c.id === currentClient)) clientSelect.value = currentClient;
            else if (appData.clients.length > 0) clientSelect.value = appData.clients[0].id;
        }

        // ============================================================
        // RENDER: Business & Client lists
        // ============================================================
        function renderBusinessList() {
            const container = document.getElementById('businessList');
            if (appData.businesses.length === 0) {
                container.innerHTML = '<div class="empty-state">No business profiles yet. Add one below.</div>';
                return;
            }
            container.innerHTML = appData.businesses.map(b => `
                    <div class="item-card">
                        <div class="info">
                            <strong>${b.name}</strong>
                            <span class="badge">ABN ${b.abn}</span>
                            <div style="font-size:12px;color:#64748b;">${b.address || 'No address'}</div>
                        </div>
                        <div>
                            <button class="btn btn-secondary btn-sm edit-biz" data-id="${b.id}">✎</button>
                            <button class="btn btn-danger btn-sm delete-biz" data-id="${b.id}">✕</button>
                        </div>
                    </div>
                `).join('');

            document.querySelectorAll('.edit-biz').forEach(btn => {
                btn.addEventListener('click', () => editBusiness(btn.dataset.id));
            });
            document.querySelectorAll('.delete-biz').forEach(btn => {
                btn.addEventListener('click', () => deleteBusiness(btn.dataset.id));
            });
        }

        function renderClientList() {
            const container = document.getElementById('clientList');
            if (appData.clients.length === 0) {
                container.innerHTML = '<div class="empty-state">No clients yet. Add one below.</div>';
                return;
            }
            container.innerHTML = appData.clients.map(c => `
                    <div class="item-card">
                        <div class="info">
                            <strong>${c.name}</strong>
                            ${c.abn ? `<span class="badge">ABN ${c.abn}</span>` : ''}
                            <div style="font-size:12px;color:#64748b;">${c.address || 'No address'}</div>
                        </div>
                        <div>
                            <button class="btn btn-secondary btn-sm edit-client" data-id="${c.id}">✎</button>
                            <button class="btn btn-danger btn-sm delete-client" data-id="${c.id}">✕</button>
                        </div>
                    </div>
                `).join('');

            document.querySelectorAll('.edit-client').forEach(btn => {
                btn.addEventListener('click', () => editClient(btn.dataset.id));
            });
            document.querySelectorAll('.delete-client').forEach(btn => {
                btn.addEventListener('click', () => deleteClient(btn.dataset.id));
            });
        }

        // ============================================================
        // CRUD: Business
        // ============================================================
        function editBusiness(id) {
            const b = getBusiness(id);
            if (!b) return;
            document.getElementById('editBizId').value = b.id;
            document.getElementById('bizName').value = b.name;
            document.getElementById('bizAbn').value = b.abn || '';
            document.getElementById('bizAddress').value = b.address || '';
            document.getElementById('bizPhone').value = b.phone || '';
            document.getElementById('bizEmail').value = b.email || '';
            document.getElementById('bizBank').value = b.bankDetails || '';
            document.getElementById('cancelBizBtn').style.display = 'inline-block';
            document.getElementById('saveBizBtn').textContent = '✎ Update Business';
            window.scrollTo({ top: document.getElementById('tab-business').offsetTop, behavior: 'smooth' });
        }

        function deleteBusiness(id) {
            if (!confirm('Delete this business?')) return;
            appData.businesses = appData.businesses.filter(b => b.id !== id);
            saveData(appData);
            renderAll();
        }

        document.getElementById('saveBizBtn').addEventListener('click', function() {
            const editId = document.getElementById('editBizId').value;
            const name = document.getElementById('bizName').value.trim();
            const abn = document.getElementById('bizAbn').value.trim();
            if (!name || !abn) { showStatus('Business Name and ABN are required.', 'error'); return; }

            const payload = {
                name,
                abn,
                address: document.getElementById('bizAddress').value.trim(),
                phone: document.getElementById('bizPhone').value.trim(),
                email: document.getElementById('bizEmail').value.trim(),
                bankDetails: document.getElementById('bizBank').value.trim()
            };

            if (editId) {
                const existing = getBusiness(editId);
                if (existing) Object.assign(existing, payload);
            } else {
                payload.id = generateId();
                appData.businesses.push(payload);
            }
            saveData(appData);
            clearBizForm();
            renderAll();
            showStatus('Business saved!', 'success');
            setTimeout(hideStatus, 2500);
        });

        document.getElementById('cancelBizBtn').addEventListener('click', clearBizForm);

        function clearBizForm() {
            document.getElementById('editBizId').value = '';
            document.getElementById('bizName').value = '';
            document.getElementById('bizAbn').value = '';
            document.getElementById('bizAddress').value = '';
            document.getElementById('bizPhone').value = '';
            document.getElementById('bizEmail').value = '';
            document.getElementById('bizBank').value = '';
            document.getElementById('cancelBizBtn').style.display = 'none';
            document.getElementById('saveBizBtn').textContent = '💾 Save Business';
            hideStatus();
        }

        // ============================================================
        // CRUD: Client
        // ============================================================
        function editClient(id) {
            const c = getClient(id);
            if (!c) return;
            document.getElementById('editClientId').value = c.id;
            document.getElementById('clientName').value = c.name;
            document.getElementById('clientAbn').value = c.abn || '';
            document.getElementById('clientAddress').value = c.address || '';
            document.getElementById('clientEmail').value = c.email || '';
            document.getElementById('cancelClientBtn').style.display = 'inline-block';
            document.getElementById('saveClientBtn').textContent = '✎ Update Client';
            window.scrollTo({ top: document.getElementById('tab-clients').offsetTop, behavior: 'smooth' });
        }

        function deleteClient(id) {
            if (!confirm('Delete this client?')) return;
            appData.clients = appData.clients.filter(c => c.id !== id);
            saveData(appData);
            renderAll();
        }

        document.getElementById('saveClientBtn').addEventListener('click', function() {
            const editId = document.getElementById('editClientId').value;
            const name = document.getElementById('clientName').value.trim();
            if (!name) { showStatus('Client Name is required.', 'error'); return; }

            const payload = {
                name,
                abn: document.getElementById('clientAbn').value.trim(),
                address: document.getElementById('clientAddress').value.trim(),
                email: document.getElementById('clientEmail').value.trim()
            };

            if (editId) {
                const existing = getClient(editId);
                if (existing) Object.assign(existing, payload);
            } else {
                payload.id = generateId();
                appData.clients.push(payload);
            }
            saveData(appData);
            clearClientForm();
            renderAll();
            showStatus('Client saved!', 'success');
            setTimeout(hideStatus, 2500);
        });

        document.getElementById('cancelClientBtn').addEventListener('click', clearClientForm);

        function clearClientForm() {
            document.getElementById('editClientId').value = '';
            document.getElementById('clientName').value = '';
            document.getElementById('clientAbn').value = '';
            document.getElementById('clientAddress').value = '';
            document.getElementById('clientEmail').value = '';
            document.getElementById('cancelClientBtn').style.display = 'none';
            document.getElementById('saveClientBtn').textContent = '💾 Save Client';
            hideStatus();
        }

        // ============================================================
        // LINE ITEMS (dynamic)
        // ============================================================
        document.getElementById('addLineItem').addEventListener('click', function() {
            const container = document.getElementById('lineItemsContainer');
            const div = document.createElement('div');
            div.className = 'line-item';
            div.innerHTML = `
                    <input type="text" placeholder="Description" class="li-desc" value="Service" />
                    <input type="number" placeholder="Hours" class="li-hours" value="1" step="0.5" min="0" />
                    <input type="number" placeholder="Rate ($)" class="li-rate" value="100" step="0.01" min="0" />
                    <button class="btn btn-danger btn-sm remove-line" style="background:#ef4444;">✕</button>
                `;
            container.appendChild(div);
            div.querySelector('.remove-line').addEventListener('click', function() {
                if (container.children.length > 1) div.remove();
                else showStatus('At least one line item is required.', 'error');
            });
            hideStatus();
        });

        // initial remove buttons
        document.querySelectorAll('.remove-line').forEach(btn => {
            btn.addEventListener('click', function() {
                const container = document.getElementById('lineItemsContainer');
                if (container.children.length > 1) this.closest('.line-item').remove();
                else showStatus('At least one line item is required.', 'error');
            });
        });

        function getLineItems() {
            const items = [];
            let valid = true;
            document.querySelectorAll('.line-item').forEach(row => {
                const desc = row.querySelector('.li-desc').value.trim() || 'Service';
                const hours = parseFloat(row.querySelector('.li-hours').value) || 0;
                const rate = parseFloat(row.querySelector('.li-rate').value) || 0;
                if (hours > 0 && rate > 0) {
                    items.push({ description: desc, hours, rate, amount: hours * rate });
                } else if (hours <= 0 || rate <= 0) {
                    valid = false;
                }
            });
            if (!valid && items.length === 0) {
                showStatus('Please ensure all line items have hours > 0 and rate > 0.', 'error');
                return null;
            }
            if (items.length === 0) {
                showStatus('Please add at least one valid line item.', 'error');
                return null;
            }
            hideStatus();
            return items;
        }

        // ============================================================
        // BUILD INVOICE DATA (for preview, accepts optional invoice number)
        // ============================================================
        function buildInvoiceData(invoiceNumber) {
            const bizId = document.getElementById('invBusiness').value;
            const clientId = document.getElementById('invClient').value;
            if (!bizId || !clientId) {
                showStatus('Please select both a Business and a Client.', 'error');
                return null;
            }
            const business = getBusiness(bizId);
            const client = getClient(clientId);
            if (!business || !client) {
                showStatus('Selected profile not found. Please refresh or re-add.', 'error');
                return null;
            }

            const items = getLineItems();
            if (!items) return null; // error already shown

            const includeGST = document.getElementById('includeGST').checked;
            const subtotal = items.reduce((sum, i) => sum + i.amount, 0);
            const gst = includeGST ? subtotal * 0.10 : 0;
            const total = subtotal + gst;
            const date = new Date().toISOString().split('T')[0];
            const finalInvoiceNumber = invoiceNumber || getTempInvoiceNumber();

            return {
                business,
                client,
                items,
                subtotal,
                gst,
                total,
                includeGST,
                invoiceNumber: finalInvoiceNumber,
                date,
                paymentTerms: '30 days from invoice date'
            };
        }

        // ============================================================
        // RENDER PREVIEW
        // ============================================================
        function renderPreview(data) {
            const container = document.getElementById('invoicePreview');
            if (!data) { container.style.display = 'none'; return; }

            const { business, client, items, subtotal, gst, total, includeGST, invoiceNumber, date, paymentTerms } = data;

            const gstLabel = includeGST ? 'GST (10%)' : 'GST (not applied)';

            let rows = items.map(i => `
                    <tr>
                        <td>${i.description}</td>
                        <td style="text-align:right;">${i.hours}</td>
                        <td style="text-align:right;">${formatCurrency(i.rate)}</td>
                        <td style="text-align:right;">${formatCurrency(i.amount)}</td>
                    </tr>
                `).join('');

            container.innerHTML = `
                    <div class="inv-header">
                        <div>
                            <div class="inv-title">${includeGST ? 'TAX INVOICE' : 'INVOICE'}</div>
                            <div style="font-size:12px;color:#64748b;"># ${invoiceNumber}</div>
                            <div style="font-size:12px;color:#64748b;">Date: ${formatDate(date)}</div>
                        </div>
                        <div class="inv-business">
                            <strong>${business.name}</strong><br />
                            ${business.abn ? 'ABN: ' + business.abn : ''}<br />
                            ${business.address || ''}<br />
                            ${business.phone || ''}<br />
                            ${business.email || ''}
                        </div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <strong>Bill to:</strong><br />
                        ${client.name}<br />
                        ${client.abn ? 'ABN: ' + client.abn : ''}<br />
                        ${client.address || ''}<br />
                        ${client.email || ''}
                    </div>
                    <table>
                        <thead><tr><th>Description</th><th style="text-align:right;">Hours</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Amount</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <div class="totals">
                        <div>Subtotal: ${formatCurrency(subtotal)}</div>
                        <div>${gstLabel}: ${formatCurrency(gst)}</div>
                        <div class="grand">Total (incl. GST): ${formatCurrency(total)}</div>
                    </div>
                    <div style="margin-top:16px;font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;padding-top:10px;">
                        Payment Terms: ${paymentTerms}<br />
                        ${business.bankDetails ? 'Bank: ' + business.bankDetails : ''}
                    </div>
                `;
            container.style.display = 'block';
            container._invoiceData = data;
            hideStatus();
        }

        // ============================================================
        // PREVIEW BUTTON
        // ============================================================
        document.getElementById('previewBtn').addEventListener('click', function() {
            // Use a temporary invoice number for preview (won't increment counter)
            const data = buildInvoiceData(getTempInvoiceNumber());
            if (data) {
                renderPreview(data);
                // Scroll to preview
                document.getElementById('invoicePreview').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });

        // ============================================================
        // GENERATE PDF (uses current preview data, assigns REAL number)
        // ============================================================
        document.getElementById('generatePdfBtn').addEventListener('click', function() {
            const preview = document.getElementById('invoicePreview');
            if (!preview.style.display || preview.style.display === 'none') {
                showStatus('Please preview the invoice first.', 'error');
                return;
            }

            let data = preview._invoiceData;
            if (!data) {
                showStatus('Invoice data missing. Please preview again.', 'error');
                return;
            }

            // If it's a temporary number (starts with PREVIEW-), replace with real one
            if (data.invoiceNumber && data.invoiceNumber.startsWith('PREVIEW-')) {
                const realNumber = getNextInvoiceNumber();
                data.invoiceNumber = realNumber;
                // Re-render preview with real number
                renderPreview(data);
                // Re-fetch data from preview
                data = preview._invoiceData;
            }

            const btn = this;
            const origText = btn.textContent;
            btn.textContent = '⏳ Generating...';
            btn.disabled = true;
            showStatus('Generating PDF...', 'success');

            html2canvas(preview, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false,
                width: 600,
                height: preview.scrollHeight
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = 190;
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                doc.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
                doc.save(`invoice-${data.invoiceNumber}.pdf`);
                btn.textContent = origText;
                btn.disabled = false;
                showStatus('✅ PDF downloaded!', 'success');
                setTimeout(hideStatus, 3000);
            }).catch(err => {
                console.error('PDF error:', err);
                showStatus('PDF generation failed: ' + err.message, 'error');
                btn.textContent = origText;
                btn.disabled = false;
            });
        });

        // ============================================================
        // SAVE INVOICE TO HISTORY (assigns REAL number if needed)
        // ============================================================
        document.getElementById('saveInvoiceBtn').addEventListener('click', function() {
            const preview = document.getElementById('invoicePreview');
            if (!preview.style.display || preview.style.display === 'none') {
                showStatus('Please preview the invoice first.', 'error');
                return;
            }

            let data = preview._invoiceData;
            if (!data) {
                showStatus('Invoice data missing. Please preview again.', 'error');
                return;
            }

            // Assign real number if temporary
            if (data.invoiceNumber && data.invoiceNumber.startsWith('PREVIEW-')) {
                const realNumber = getNextInvoiceNumber();
                data.invoiceNumber = realNumber;
                renderPreview(data);
                data = preview._invoiceData;
            }

            // Double-check duplicate
            if (appData.invoices.some(inv => inv.invoiceNumber === data.invoiceNumber)) {
                showStatus('Invoice #' + data.invoiceNumber + ' already exists in history.', 'error');
                return;
            }

            const record = {
                id: generateId(),
                businessId: data.business.id,
                clientId: data.client.id,
                date: data.date,
                invoiceNumber: data.invoiceNumber,
                items: data.items,
                includeGST: data.includeGST,
                subtotal: data.subtotal,
                gst: data.gst,
                total: data.total,
                paymentTerms: data.paymentTerms
            };
            appData.invoices.push(record);
            saveData(appData);
            document.getElementById('saveMessage').textContent = '✅ Invoice #' + data.invoiceNumber + ' saved!';
            showStatus('✅ Invoice saved to history!', 'success');
            setTimeout(() => {
                document.getElementById('saveMessage').textContent = '';
                hideStatus();
            }, 3000);
            renderHistory();
        });

        // ============================================================
        // HISTORY
        // ============================================================
        function renderHistory() {
            const container = document.getElementById('historyList');
            if (appData.invoices.length === 0) {
                container.innerHTML = '<div class="empty-state">No invoices saved yet.</div>';
                return;
            }
            const sorted = [...appData.invoices].reverse();
            container.innerHTML = sorted.map(inv => {
                const biz = getBusiness(inv.businessId);
                const client = getClient(inv.clientId);
                const bizName = biz ? biz.name : '❌ Deleted';
                const clientName = client ? client.name : '❌ Deleted';
                return `
                        <div class="hist-item">
                            <div class="left">
                                <div class="num">${inv.invoiceNumber}</div>
                                <div style="font-size:13px;color:#64748b;">${formatDate(inv.date)} · ${clientName}</div>
                                <div style="font-size:13px;font-weight:600;">${formatCurrency(inv.total)}</div>
                            </div>
                            <div class="right">
                                <button class="btn btn-secondary btn-sm hist-view" data-id="${inv.id}">👁️ View</button>
                                <button class="btn btn-secondary btn-sm hist-pdf" data-id="${inv.id}">📄 PDF</button>
                                <button class="btn btn-danger btn-sm hist-delete" data-id="${inv.id}">✕</button>
                            </div>
                        </div>
                    `;
            }).join('');

            document.querySelectorAll('.hist-view').forEach(btn => {
                btn.addEventListener('click', function() {
                    const inv = appData.invoices.find(i => i.id === this.dataset.id);
                    if (!inv) return;
                    const biz = getBusiness(inv.businessId);
                    const client = getClient(inv.clientId);
                    if (!biz || !client) { showStatus('Business or client missing.', 'error'); return; }
                    const data = {
                        business: biz,
                        client: client,
                        items: inv.items,
                        subtotal: inv.subtotal,
                        gst: inv.gst,
                        total: inv.total,
                        includeGST: inv.includeGST,
                        invoiceNumber: inv.invoiceNumber,
                        date: inv.date,
                        paymentTerms: inv.paymentTerms || '30 days'
                    };
                    renderPreview(data);
                    switchTab('tab-invoice');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            document.querySelectorAll('.hist-pdf').forEach(btn => {
                btn.addEventListener('click', function() {
                    const inv = appData.invoices.find(i => i.id === this.dataset.id);
                    if (!inv) return;
                    const biz = getBusiness(inv.businessId);
                    const client = getClient(inv.clientId);
                    if (!biz || !client) { showStatus('Business or client missing.', 'error'); return; }
                    const data = {
                        business: biz,
                        client: client,
                        items: inv.items,
                        subtotal: inv.subtotal,
                        gst: inv.gst,
                        total: inv.total,
                        includeGST: inv.includeGST,
                        invoiceNumber: inv.invoiceNumber,
                        date: inv.date,
                        paymentTerms: inv.paymentTerms || '30 days'
                    };
                    const preview = document.getElementById('invoicePreview');
                    const wasVisible = preview.style.display !== 'none';
                    renderPreview(data);
                    preview.style.display = 'block';
                    document.getElementById('generatePdfBtn').click();
                    if (!wasVisible) preview.style.display = 'none';
                });
            });

            document.querySelectorAll('.hist-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (!confirm('Delete this invoice from history?')) return;
                    appData.invoices = appData.invoices.filter(i => i.id !== this.dataset.id);
                    saveData(appData);
                    renderHistory();
                    showStatus('🗑️ Deleted.', 'success');
                    setTimeout(hideStatus, 2000);
                });
            });
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', function() {
            if (!confirm('Delete ALL invoices from history? This cannot be undone.')) return;
            appData.invoices = [];
            saveData(appData);
            renderHistory();
            showStatus('🗑️ History cleared.', 'success');
            setTimeout(hideStatus, 2000);
        });

        // ============================================================
        // EXPORT / IMPORT
        // ============================================================
        document.getElementById('exportDataBtn').addEventListener('click', function() {
            const json = JSON.stringify(appData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'aus-invoice-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importDataBtn').addEventListener('click', function() {
            document.getElementById('importFileInput').click();
        });

        document.getElementById('importFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (!imported.businesses || !imported.clients || !imported.invoices) {
                        showStatus('Invalid backup file.', 'error');
                        return;
                    }
                    if (!confirm('This will replace ALL current data. Continue?')) return;
                    appData = imported;
                    if (!appData.nextInvoiceNumber) appData.nextInvoiceNumber = 1;
                    saveData(appData);
                    renderAll();
                    showStatus('Data imported successfully!', 'success');
                    setTimeout(hideStatus, 3000);
                } catch (err) {
                    showStatus('Failed to import: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        // ============================================================
        // TABS
        // ============================================================
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
            if (tabId === 'tab-history') renderHistory();
            if (tabId === 'tab-clients') renderClientList();
            if (tabId === 'tab-business') renderBusinessList();
            if (tabId === 'tab-invoice') { populateDropdowns();
                hideStatus(); }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        // ============================================================
        // RENDER ALL
        // ============================================================
        function renderAll() {
            populateDropdowns();
            renderBusinessList();
            renderClientList();
            renderHistory();
            hideStatus();
        }

        // ============================================================
        // INIT
        // ============================================================
        renderAll();
        console.log('🧾 Aus Invoice App ready. Data:', appData);
        console.log('💡 Tap "Preview" – if nothing happens, check the red error box above the button.');
    </script>

</body>
</html>
