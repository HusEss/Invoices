                    document.getElementById('editingInvoiceId').value = '';
                    document.getElementById('editingInvoiceNumber').value = '';
                    document.getElementById('cancelEditBtn').style.display = 'none';
                    document.getElementById('saveInvoiceBtn').textContent = '💾 Save';

                    document.getElementById('invBusiness').value = biz.id;
                    document.getElementById('invClient').value = client.id;
                    document.getElementById('includeGST').checked = inv.includeGST;
                    document.getElementById('paymentTerms').value = inv.paymentTerms || '30 days';
                    document.getElementById('invoiceNotes').value = inv.invoiceNotes || '';

                    const container = document.getElementById('lineItemsContainer');
                    container.innerHTML = '';
                    inv.items.forEach((item) => {
                        const div = document.createElement('div');
                        div.className = 'line-item';
                        div.innerHTML = `
                                <input type="text" placeholder="Description" class="li-desc" value="${item.description}" />
                                <input type="number" placeholder="Qty/Hrs" class="li-hours" value="${item.hours}" step="0.5" min="0" />
                                <input type="number" placeholder="Rate ($)" class="li-rate" value="${item.rate}" step="0.01" min="0" />
                                <input type="date" class="li-start" placeholder="Start" value="${item.start || ''}" />
                                <input type="date" class="li-end" placeholder="End" value="${item.end || ''}" />
                                <button class="btn btn-danger btn-sm remove-line" style="background:#e53e3e;">✕</button>
                            `;
                        container.appendChild(div);
                        div.querySelector('.remove-line').addEventListener('click', function() {
                            if (container.children.length > 1) div.remove();
                            else showStatus('At least one line item is required.', 'error');
                        });
                    });

                    const data = buildInvoiceData(getTempInvoiceNumber());
                    if (data) renderPreview(data);

                    switchTab('tab-invoice');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    showStatus('📋 Duplicated – ready to save as new invoice.', 'success');
                    setTimeout(hideStatus, 3000);
                });
            });

            document.querySelectorAll('.hist-pdf, .hist-png').forEach(btn => {
                btn.addEventListener('click', function() {
                    const inv = appData.invoices.find(i => i.id === this.dataset.id);
                    if (!inv) return;
                    const biz = getBusiness(inv.businessId);
                    const client = getClient(inv.clientId);
                    if (!biz || !client) { showStatus('Business or client missing.', 'error'); return; }
                    const data = {
                        business: biz,
                        client: client,
                        items: inv.items,
                        subtotal: inv.subtotal,
                        gst: inv.gst,
                        total: inv.total,
                        includeGST: inv.includeGST,
                        invoiceNumber: inv.invoiceNumber,
                        date: inv.date,
                        paymentTerms: inv.paymentTerms || '30 days',
                        bankDetails: inv.bankDetails || '',
                        invoiceNotes: inv.invoiceNotes || '',
                        totalWords: inv.totalWords || ''
                    };
                    const preview = document.getElementById('invoicePreview');
                    const wasVisible = preview.style.display !== 'none';
                    renderPreview(data);
                    preview.style.display = 'block';
                    const type = this.classList.contains('hist-pdf') ? 'pdf' : 'png';
                    preview._invoiceData = data;
                    generateFromPreview(type);
                    if (!wasVisible) preview.style.display = 'none';
                });
            });

            document.querySelectorAll('.hist-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (!confirm('Delete this invoice?')) return;
                    appData.invoices = appData.invoices.filter(i => i.id !== this.dataset.id);
                    saveData(appData);
                    renderHistory();
                    showStatus('🗑️ Deleted.', 'success');
                    setTimeout(hideStatus, 2000);
                });
            });
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', function() {
            if (!confirm('Delete ALL invoices?')) return;
            appData.invoices = [];
            saveData(appData);
            renderHistory();
            showStatus('🗑️ History cleared.', 'success');
            setTimeout(hideStatus, 2000);
        });

        document.getElementById('historyClientFilter').addEventListener('change', renderHistory);

        // ============================================================
        // EXPORT / IMPORT
        // ============================================================
        document.getElementById('exportDataBtn').addEventListener('click', function() {
            const json = JSON.stringify(appData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'aus-invoice-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importDataBtn').addEventListener('click', function() {
            document.getElementById('importFileInput').click();
        });

        document.getElementById('importFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (!imported.businesses || !imported.clients || !imported.invoices) {
                        showStatus('Invalid backup file.', 'error');
                        return;
                    }
                    if (!confirm('This will replace ALL current data. Continue?')) return;
                    appData = imported;
                    appData.clients.forEach(c => { if (c.nextInvoiceNumber === undefined) c.nextInvoiceNumber = 1; });
                    saveData(appData);
                    renderAll();
                    showStatus('Data imported!', 'success');
                    setTimeout(hideStatus, 3000);
                } catch (err) {
                    showStatus('Failed to import: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        // ============================================================
        // TABS
        // ============================================================
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
            if (tabId === 'tab-history') { populateHistoryFilter();
                renderHistory(); }
            if (tabId === 'tab-clients') { renderClientList();
                filterClientList(); }
            if (tabId === 'tab-business') { renderBusinessList();
                filterBusinessList(); }
            if (tabId === 'tab-invoice') { populateDropdowns();
                hideStatus(); }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        // ============================================================
        // RENDER ALL
        // ============================================================
        function renderAll() {
            populateDropdowns();
            renderBusinessList();
            renderClientList();
            populateHistoryFilter();
            renderHistory();
            hideStatus();
            filterClientList();
            filterBusinessList();
        }

        renderAll();
        console.log('🧾 Invoice App ready – TEXT-BASED LAYOUT (no tables!)');
        console.log('✅ Demo data: Essale Trading Co & Sydney Construction Pty Ltd');
        console.log('✅ This layout is 100% reliable on all devices.');
    </script>
